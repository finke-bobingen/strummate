<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StrumMate 2.0 – Audio Basis</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101318;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:820px;margin:auto;padding:28px 20px 60px}
h1{font-size:34px;margin:0 0 6px}
.sub{color:#aeb6c2;margin:0 0 28px;font-size:17px}
.card{background:#191e26;border:1px solid #2c3440;border-radius:20px;padding:22px}
.file{display:block;width:100%;padding:18px;border:1px dashed #566273;border-radius:14px;font-size:17px}
.song{margin:18px 0 4px;font-size:20px;font-weight:700}
.time{font-variant-numeric:tabular-nums;font-size:42px;font-weight:750;margin:22px 0;text-align:center}
.controls{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:12px}
button{min-height:64px;border:0;border-radius:16px;font-size:19px;font-weight:700;background:#2a313c;color:#fff}
button.primary{background:#fff;color:#111}
button:disabled{opacity:.4}
.status{margin-top:18px;color:#aeb6c2;text-align:center}
audio{display:none}
</style>
</head>
<body>
<main>
<h1>StrumMate 2.0</h1>
<p class="sub">Schritt 1 · stabile Audio-Basis fürs iPad</p>
<div class="card">
<label class="file">🎵 Audiodatei auswählen
<input id="file" type="file" accept="audio/*" hidden>
</label>
<div class="song" id="song">Noch kein Song geladen</div>
<div class="time"><span id="now">00:00</span> <span style="color:#687281">/</span> <span id="dur">00:00</span></div>
<div class="controls">
<button id="back" disabled>−5 s</button>
<button id="play" class="primary" disabled>▶ Start</button>
<button id="forward" disabled>+5 s</button>
</div>
<div class="status" id="status">Bitte zuerst eine Audiodatei auswählen.</div>
<audio id="audio" preload="metadata"></audio>
</div>
</main>
<script>
const audio=document.getElementById("audio");
const file=document.getElementById("file");
const play=document.getElementById("play");
const back=document.getElementById("back");
const forward=document.getElementById("forward");
const now=document.getElementById("now");
const dur=document.getElementById("dur");
const song=document.getElementById("song");
const status=document.getElementById("status");
let objectURL=null;

function fmt(s){
 if(!Number.isFinite(s)) return "00:00";
 s=Math.max(0,Math.floor(s));
 return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function ready(on){ play.disabled=back.disabled=forward.disabled=!on; }

file.addEventListener("change",()=>{
 const f=file.files && file.files[0];
 if(!f) return;
 if(objectURL) URL.revokeObjectURL(objectURL);
 objectURL=URL.createObjectURL(f);
 audio.src=objectURL;
 audio.load();
 song.textContent=f.name;
 status.textContent="Datei geladen. Jetzt Start drücken.";
 ready(true);
});

play.addEventListener("click",async()=>{
 try{
   if(audio.paused){ await audio.play(); }
   else{ audio.pause(); }
 }catch(e){ status.textContent="Wiedergabe konnte nicht gestartet werden."; }
});
back.addEventListener("click",()=>{ audio.currentTime=Math.max(0,audio.currentTime-5); });
forward.addEventListener("click",()=>{ audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+5); });

audio.addEventListener("loadedmetadata",()=>{ dur.textContent=fmt(audio.duration); });
audio.addEventListener("timeupdate",()=>{ now.textContent=fmt(audio.currentTime); });
audio.addEventListener("play",()=>{ play.textContent="❚❚ Pause"; status.textContent="Wiedergabe läuft."; });
audio.addEventListener("pause",()=>{ play.textContent="▶ Start"; if(audio.currentTime<audio.duration) status.textContent="Pausiert."; });
audio.addEventListener("ended",()=>{ play.textContent="▶ Start"; status.textContent="Song beendet."; });
audio.addEventListener("error",()=>{ status.textContent="Diese Audiodatei konnte nicht geladen werden."; });
</script>
</body>
</html>
