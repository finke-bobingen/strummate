<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>StrumMate – YouTube Audiotest</title>
<style>
body{margin:0;background:#111318;color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:900px;margin:auto;padding:24px}
h1{font-size:28px;margin:0 0 8px}
p{color:#b8bec9;font-size:17px;line-height:1.45}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;margin-top:20px}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.note{margin-top:18px;padding:16px;border:1px solid #343946;border-radius:14px}
</style>
</head>
<body>
<main>
<h1>StrumMate – reiner YouTube-Audiotest</h1>
<p>Keine Loops, keine eigene Player-Steuerung, keine YouTube-IFrame-API. Nur der originale YouTube-Embed.</p>
<div class="player">
<iframe
 src="https://www.youtube.com/embed/_5sNO8ith70?playsinline=1"
 title="Danny Vera – Roller Coaster"
 allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
 allowfullscreen>
</iframe>
</div>
<div class="note">
<strong>Test:</strong> Video direkt im YouTube-Fenster starten. Danach nur prüfen, ob Ton kommt.
</div>
</main>
</body>
</html>
